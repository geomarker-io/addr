# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

jobs:
  CLI:
    runs-on: ubuntu-latest

    name: CLI (ubuntu-latest)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'

      - name: Install addr
        run: R CMD INSTALL .

      - name: Test installed CLI
        shell: bash
        run: |
          cli_script="$(Rscript -e 'cat(system.file("exec", "addr-geocode", package = "addr"))')"
          test -n "$cli_script"
          ADDR_GEOCODE_CLI_SCRIPT="$cli_script" Rscript cli-tests/test-addr-geocode.R

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest, r: 'release', manual: true}
          - {os: ubuntu-latest, r: 'devel', limited: true}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: ubuntu-22.04, r: '4.2.0', minimum: true, limited: true}

    env:
      ADDR_RUN_NETWORK_TESTS: "false"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_MAX_PROTECT_SIZE: 500000
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.limited && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.71.0
        if: matrix.config.minimum

      - name: Install Linux validation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts tidy qpdf

      - name: Install macOS validation tools
        if: runner.os == 'macOS'
        run: brew install checkbashisms tidy-html5 qpdf

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual

      - name: Install manual fonts and LaTeX packages
        if: matrix.config.manual
        run: |
          tlmgr update --self
          tlmgr install collection-fontsrecommended inconsolata fancyvrb

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: '!matrix.config.limited'
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.config.limited
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::withr
          cache-version: minimum-dependencies

      - name: Verify optional runtime packages are absent
        if: matrix.config.limited
        shell: Rscript {0}
        run: |
          optional <- c("arrow", "dplyr", "leaflet", "mirai", "sf")
          stopifnot(!any(vapply(optional, requireNamespace, logical(1), quietly = TRUE)))

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          upload-results: true
          build_args: '"--no-build-vignettes"'
          args: ${{ matrix.config.manual && '"--as-cran"' || 'c("--no-manual", "--as-cran")' }}
          error-on: '"warning"'
