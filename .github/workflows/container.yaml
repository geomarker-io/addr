on:
  pull_request:
    branches: [main, master]
  release:
    types: [published]

name: container

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/geomarker-io/addr
  R_VERSION: "4.4.3"
  RUST_VERSION: "1.95.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_CREATED: ${{ github.event_name == 'release' && github.event.release.published_at || github.event.pull_request.updated_at }}
      IMAGE_REVISION: ${{ github.sha }}
      IMAGE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('pr-{0}', github.event.pull_request.number) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local image
        id: build-local
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          build-args: |
            R_VERSION=${{ env.R_VERSION }}
            RUST_VERSION=${{ env.RUST_VERSION }}
            BUILD_DATE=${{ env.IMAGE_CREATED }}
            VCS_REF=${{ env.IMAGE_REVISION }}
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
          context: .
          file: ./Containerfile
          load: true
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          tags: addr:ci-${{ matrix.arch }}

      - name: Build and push image by digest
        id: build-release
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          build-args: |
            R_VERSION=${{ env.R_VERSION }}
            RUST_VERSION=${{ env.RUST_VERSION }}
            BUILD_DATE=${{ env.IMAGE_CREATED }}
            VCS_REF=${{ env.IMAGE_REVISION }}
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
          context: .
          file: ./Containerfile
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false

      - name: Verify image runtime
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build-release.outputs.digest }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = release ]; then
            image_ref="${REGISTRY_IMAGE}@${DIGEST}"
            docker pull "$image_ref"
          else
            image_ref="addr:ci-${ARCH}"
          fi

          case "$ARCH" in
            amd64) expected_r_arch=x86_64 ;;
            arm64) expected_r_arch=aarch64 ;;
          esac

          package_version="$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION)"
          docker image inspect "$image_ref" | jq -e '
            .[0].Config.User == "addr" and
            .[0].Config.WorkingDir == "/home/addr" and
            .[0].Config.Cmd == ["R", "--quiet", "--no-save"] and
            .[0].Config.Entrypoint == null
          ' >/dev/null
          docker run --rm \
            --env EXPECTED_ADDR_VERSION="$package_version" \
            --env EXPECTED_R_ARCH="$expected_r_arch" \
            "$image_ref" \
            Rscript -e 'stopifnot(R.version$arch == Sys.getenv("EXPECTED_R_ARCH"), as.character(packageVersion("addr")) == Sys.getenv("EXPECTED_ADDR_VERSION"), packageVersion("stow") >= package_version("0.3.0"), Sys.info()[["user"]] == "addr", getwd() == "/home/addr", Sys.getenv("R_USER_DATA_DIR") == "/opt/addr-data", file.exists("/usr/local/bin/addr-geocode"))'

      - name: Export image digest
        if: github.event_name == 'release'
        env:
          DIGEST: ${{ steps.build-release.outputs.digest }}
        run: |
          set -euo pipefail
          digest_hex="${DIGEST#sha256:}"
          [[ "$digest_hex" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest_hex}"

      - name: Upload image digest
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: container-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: container-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform OCI index
        env:
          CREATED: ${{ github.event.release.published_at }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f | sort)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "Expected two platform digests, found ${#digest_files[@]}." >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest_hex="$(basename "$digest_file")"
            [[ "$digest_hex" =~ ^[0-9a-f]{64}$ ]]
            sources+=("${REGISTRY_IMAGE}@sha256:${digest_hex}")
          done

          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:${RELEASE_TAG}" \
            --tag "${REGISTRY_IMAGE}:latest" \
            --annotation "index:org.opencontainers.image.title=addr" \
            --annotation "index:org.opencontainers.image.description=R runtime with the addr package installed" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.url=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.documentation=https://geomarker.io/addr/" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --annotation "index:org.opencontainers.image.created=${CREATED}" \
            --annotation "index:org.opencontainers.image.revision=${REVISION}" \
            --annotation "index:org.opencontainers.image.version=${RELEASE_TAG}" \
            "${sources[@]}"

          index_json="$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${RELEASE_TAG}" --raw)"
          jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json" and
            (.manifests | length) == 2 and
            ([.manifests[].platform | "\(.os)/\(.architecture)"] | sort) == ["linux/amd64", "linux/arm64"]
          ' <<<"$index_json" >/dev/null
